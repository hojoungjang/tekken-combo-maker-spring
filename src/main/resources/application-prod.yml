spring:
#  config:
#    import: ./env/.env.prod[.properties]

  datasource:
    url: jdbc:mysql://${MYSQL_HOST_URL}/${MYSQL_DB_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
    open-in-view: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

logging.level:
  org.hibernate.SQL: debug
  org.hibernate.type: trace
  org.springframework.security: DEBUG
  org.springframework.data.mongodb.core.MongoTemplate: DEBUG
  org.flywaydb: debug

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    jmx:
      exposure:
        exclude: "*"
    web:
      base-path: "/api/actuator"
      exposure:
        include: "health"
    access:
      default: none
  endpoint:
    health:
      access: read-only
  health:
    ssl:
      enabled: false

server:
  error:
    include-stacktrace: never
